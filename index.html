<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин электросамокатов, скейтбордов и запчастей</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 30px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .section {
            margin-bottom: 40px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px solid #e9ecef;
        }

        .section h2 {
            color: #495057;
            margin-bottom: 20px;
            font-size: 1.8em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .product-card {
            background: white;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            padding: 15px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .product-card h3 {
            color: #212529;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .product-card p {
            color: #6c757d;
            margin: 5px 0;
            font-size: 0.9em;
        }

        .product-card .price {
            color: #28a745;
            font-weight: bold;
            font-size: 1.3em;
            margin: 10px 0;
        }

        .product-card .stock {
            color: #dc3545;
            font-weight: bold;
        }

        .order-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 5px;
            color: #495057;
            font-weight: 600;
        }

        input, select {
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            margin-left: 10px;
        }

        button.success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .orders-list {
            list-style: none;
        }

        .order-item {
            background: white;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-item-info {
            flex: 1;
        }

        .order-item-info h4 {
            color: #212529;
            margin-bottom: 5px;
        }

        .order-item-info p {
            color: #6c757d;
            font-size: 0.9em;
            margin: 3px 0;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            margin-left: 10px;
        }

        .status-pending {
            background: #ffc107;
            color: #000;
        }

        .status-completed {
            background: #28a745;
            color: white;
        }

        .download-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #6c757d;
        }

        @media (max-width: 768px) {
            .order-form {
                grid-template-columns: 1fr;
            }

            .order-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛴 Магазин электросамокатов, скейтбордов и запчастей</h1>

        <div id="message" class="message"></div>

        <!-- Секция каталога продуктов -->
        <div class="section">
            <h2>Каталог продуктов</h2>
            <div id="products-container" class="loading">Загрузка продуктов...</div>
        </div>

        <!-- Секция создания заказа -->
        <div class="section">
            <h2>Создать заказ</h2>
            <form id="order-form" class="order-form">
                <div class="form-group">
                    <label for="product-select">Выберите продукт:</label>
                    <select id="product-select" required>
                        <option value="">-- Выберите продукт --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="quantity">Количество:</label>
                    <input type="number" id="quantity" min="1" value="1" required>
                </div>
                <div class="form-group">
                    <label for="customer-name">Ваше имя:</label>
                    <input type="text" id="customer-name" required>
                </div>
                <div class="form-group">
                    <label for="customer-phone">Телефон:</label>
                    <input type="tel" id="customer-phone" required>
                </div>
                <div class="form-group full-width">
                    <button type="submit">Создать заказ</button>
                    <button type="button" class="secondary" onclick="refreshOrders()">Обновить список заказов</button>
                </div>
            </form>
        </div>

        <!-- Секция списка заказов -->
        <div class="section">
            <h2>Список заказов</h2>
            <div id="orders-container" class="loading">Загрузка заказов...</div>
        </div>

        <!-- Секция статистики -->
        <div class="section">
            <h2>Статистика</h2>
            <div class="download-buttons">
                <button class="success" onclick="downloadStatistics('json')">Скачать статистику (JSON)</button>
                <button class="success" onclick="downloadStatistics('xml')">Скачать статистику (XML)</button>
                <button class="success" onclick="downloadStatistics('html')">Скачать статистику (HTML)</button>
            </div>
        </div>
    </div>

    <script>
        // Загрузка продуктов при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();
            loadOrders();
        });

        // Загрузка продуктов
        async function loadProducts() {
            try {
                const response = await fetch('/api/products');
                if (!response.ok) throw new Error('Ошибка загрузки продуктов');
                
                const products = await response.json();
                displayProducts(products);
                populateProductSelect(products);
            } catch (error) {
                showMessage('Ошибка при загрузке продуктов: ' + error.message, 'error');
                document.getElementById('products-container').innerHTML = 
                    '<p style="color: red;">Ошибка загрузки продуктов</p>';
            }
        }

        // Отображение продуктов
        function displayProducts(products) {
            const container = document.getElementById('products-container');
            
            if (products.length === 0) {
                container.innerHTML = '<p>Продукты отсутствуют</p>';
                return;
            }

            container.innerHTML = '<div class="products-grid"></div>';
            const grid = container.querySelector('.products-grid');

            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <h3>${product.name}</h3>
                    <p><strong>Категория:</strong> ${product.category}</p>
                    <p><strong>Бренд:</strong> ${product.brand}</p>
                    <p class="price">${product.price} руб.</p>
                    <p class="stock">Остаток: ${product.stock} шт.</p>
                    ${product.description ? `<p><em>${product.description}</em></p>` : ''}
                `;
                grid.appendChild(card);
            });
        }

        // Заполнение выпадающего списка продуктов
        function populateProductSelect(products) {
            const select = document.getElementById('product-select');
            select.innerHTML = '<option value="">-- Выберите продукт --</option>';
            
            products.forEach(product => {
                const option = document.createElement('option');
                option.value = product.id;
                option.textContent = `${product.name} (${product.price} руб., остаток: ${product.stock})`;
                option.disabled = product.stock === 0;
                select.appendChild(option);
            });
        }

        // Обработка формы заказа
        document.getElementById('order-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const productId = document.getElementById('product-select').value;
            const quantity = parseInt(document.getElementById('quantity').value);
            const customerName = document.getElementById('customer-name').value;
            const customerPhone = document.getElementById('customer-phone').value;

            if (!productId) {
                showMessage('Пожалуйста, выберите продукт', 'error');
                return;
            }

            try {
                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        productId,
                        quantity,
                        customerName,
                        customerPhone
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка при создании заказа');
                }

                showMessage('Заказ успешно создан!', 'success');
                
                // Очистка формы
                document.getElementById('order-form').reset();
                document.getElementById('quantity').value = 1;

                // Обновление данных
                loadProducts();
                loadOrders();
            } catch (error) {
                showMessage('Ошибка: ' + error.message, 'error');
            }
        });

        // Загрузка заказов
        async function loadOrders() {
            try {
                const response = await fetch('/api/orders/refresh', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) throw new Error('Ошибка загрузки заказов');
                
                const orders = await response.json();
                displayOrders(orders);
            } catch (error) {
                showMessage('Ошибка при загрузке заказов: ' + error.message, 'error');
                document.getElementById('orders-container').innerHTML = 
                    '<p style="color: red;">Ошибка загрузки заказов</p>';
            }
        }

        // Обновление списка заказов
        function refreshOrders() {
            loadOrders();
        }

        // Отображение заказов
        function displayOrders(orders) {
            const container = document.getElementById('orders-container');
            
            if (orders.length === 0) {
                container.innerHTML = '<p>Заказы отсутствуют</p>';
                return;
            }

            const list = document.createElement('ul');
            list.className = 'orders-list';

            orders.forEach(order => {
                const item = document.createElement('li');
                item.className = 'order-item';
                
                const statusClass = order.status === 'completed' ? 'status-completed' : 'status-pending';
                const statusText = order.status === 'completed' ? 'Завершен' : 'Ожидает';
                
                item.innerHTML = `
                    <div class="order-item-info">
                        <h4>${order.productName} <span class="status-badge ${statusClass}">${statusText}</span></h4>
                        <p><strong>Клиент:</strong> ${order.customerName}</p>
                        <p><strong>Телефон:</strong> ${order.customerPhone}</p>
                        <p><strong>Количество:</strong> ${order.quantity} шт.</p>
                        <p><strong>Сумма:</strong> ${order.totalPrice} руб.</p>
                        <p><strong>Дата:</strong> ${new Date(order.createdAt).toLocaleString('ru-RU')}</p>
                    </div>
                    <button class="secondary" onclick="deleteOrder('${order.id}')">Удалить</button>
                `;
                list.appendChild(item);
            });

            container.innerHTML = '';
            container.appendChild(list);
        }

        // Удаление заказа
        async function deleteOrder(orderId) {
            if (!confirm('Вы уверены, что хотите удалить этот заказ?')) {
                return;
            }

            try {
                const response = await fetch(`/api/orders/${orderId}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка при удалении заказа');
                }

                showMessage('Заказ успешно удален!', 'success');
                
                // Обновление данных
                loadProducts();
                loadOrders();
            } catch (error) {
                showMessage('Ошибка: ' + error.message, 'error');
            }
        }

        // Скачивание статистики
        async function downloadStatistics(format) {
            try {
                let acceptHeader;
                let filename;
                let mimeType;

                switch(format) {
                    case 'xml':
                        acceptHeader = 'application/xml';
                        filename = 'statistics.xml';
                        mimeType = 'application/xml';
                        break;
                    case 'html':
                        acceptHeader = 'text/html';
                        filename = 'statistics.html';
                        mimeType = 'text/html';
                        break;
                    default:
                        acceptHeader = 'application/json';
                        filename = 'statistics.json';
                        mimeType = 'application/json';
                }

                const response = await fetch('/api/statistics', {
                    headers: {
                        'Accept': acceptHeader
                    }
                });

                if (!response.ok) throw new Error('Ошибка загрузки статистики');

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);

                showMessage(`Статистика скачана в формате ${format.toUpperCase()}`, 'success');
            } catch (error) {
                showMessage('Ошибка при скачивании статистики: ' + error.message, 'error');
            }
        }

        // Показ сообщений
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';

            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
